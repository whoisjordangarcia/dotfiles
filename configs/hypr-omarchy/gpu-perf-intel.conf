# Lightweight profile for Intel iGPU — no animations, no blur, no frills
animations {
    enabled = no
}

decoration {
    # rounding stays enabled (set in looknfeel.conf) — it's cheap even on iGPU
    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

render {
    direct_scanout = true
}

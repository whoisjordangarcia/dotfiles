name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The statusline renderer is TypeScript run directly by node, which needs >= 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run every suite
        run: bash script/test.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # Git Bash, the same shell the profile targets
    steps:
      - uses: actions/checkout@v4
      - name: Windows profile tests
        run: bash script/windows_test.sh
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errs) | Out-Null
            foreach ($e in $errs) {
              Write-Host "$($_.FullName): $($e.Message)"
              $failed = 1
            }
          }
          exit $failed

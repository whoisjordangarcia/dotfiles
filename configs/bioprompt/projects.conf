# Per-project scopes for the touchid-gate hook (Claude Code + Codex).
#
#   <path prefix>   <scope>[,<scope>...]
#
# The global patterns in configs/claude/hooks/gate_patterns.py (sudo, prod AWS,
# 1Password, curl | sh, force push, …) fire in EVERY directory regardless of
# this file — it only switches on extras, so a typo here can weaken nothing.
# Prefixes match on a path boundary, so ~/dev/dot does not match ~/dev/dotfiles.
#
# Scopes available (see SCOPED_PATTERNS in gate_patterns.py):
#   git-write   git commit / git push need a Touch ID press or YubiKey tap
#
# Comment a line out to go back to global-only in that tree.

~/projects/nest    git-write
~/dev/dotfiles     git-write

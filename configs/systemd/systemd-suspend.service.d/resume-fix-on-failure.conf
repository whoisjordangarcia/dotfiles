# T2 MacBook: run resume-fix-t2 even when the suspend ATTEMPT fails.
#
# suspend-fix-t2 hangs off sleep.target, which always activates — it is the
# entry to sleep. resume-fix-t2 hangs off suspend.target, which activates only
# after a *completed* sleep cycle. So an aborted suspend tears the T2 stack
# down and never puts it back: no WiFi, no keyboard/trackpad, no Touch Bar,
# and the machine sits awake cooking with the lid shut until it's rebooted.
#
# Aborts are not hypothetical here — a task stuck in D state under amdgpu
# (dma_fence_wait in amdgpu_vm_fini) trips "Freezing user space processes
# failed after 20.003 seconds", which fails systemd-suspend.service, which
# fails the suspend.target job. OnFailure= is the one hook that still fires on
# that path, so the restore becomes unconditional like the teardown already is.
[Unit]
OnFailure=resume-fix-t2.service
